# GPD Configuration File for TidyBot2
# 
# This file configures the Grasp Pose Detection (GPD) algorithm.
# For more details on parameters, see comment in ~/grasp_libraries/gpd/cfg/eigen_params.cfg
#
# IMPORTANT: Before using, update file paths to match your system:
#   - weight_file: path to neural network weights
#   - model_file: path to neural network model definition
#   - workspace: adjust to your robot's reachable area

# ============================================================================
# FILE PATHS (MUST BE UPDATED!)
# ============================================================================
# Path to the CNN weight file (caffe model)
# Default: use 15-channel single-view model (higher quality, slower)
weight_file = /home/elisabeth/me326-team7/ros2_ws/src/tidybot_perception/models/caffe/15channels/single_view_15_channels.caffemodel

# Path to the CNN model definition (caffe prototxt)
model_file = /home/elisabeth/me326-team7/ros2_ws/src/tidybot_perception/models/caffe/15channels/lenet.prototxt

# ============================================================================
# GRASP DETECTION PARAMETERS
# ============================================================================
# Number of grasp candidate samples to generate
# Higher values = better quality grasps but slower processing (1-30k typical)
num_samples = 15000

# Number of threads for parallel processing
# Set to number of CPU cores for best performance
num_threads = 8

# Workspace: cuboid region where to search for grasps
# Format: min_x max_x min_y max_y min_z max_z (in meters, relative to point cloud origin)
# For TidyBot2: -0.5 to +0.5 in X/Y (left-right), 0.0 to 1.5 in Z (height)
# Adjust based on your robot's reachable space
workspace = -0.5 0.5 -0.5 0.5 0.0 1.5

# Filtering
filter_approach_direction = 0  # 1 to filter grasps by approach direction
filter_workspace = 1           # 1 to filter grasps outside workspace

# ============================================================================
# GRIPPER SPECIFICATION
# ============================================================================
# These parameters describe your gripper's physical dimensions
# Match these to your actual gripper!

# Finger radius (meter) - distance from gripper centerline to fingertip
# TidyBot gripper fingers: ~1.5cm radius
radius = 0.015

# Distance between the two fingers when gripper is closed (meter)
finger_width = 0.02

# Maximum outer diameter of gripper hand (meter)
# Used to check collisions with environment
hand_outer_diameter = 0.12

# Minimum aperture (opening) of gripper (meter)
# Grasps smaller than this value are not feasible
min_aperture = 0.0

# Maximum aperture (opening) of gripper (meter)
# For TidyBot gripper: ~10cm fully open
max_aperture = 0.10

# ============================================================================
# CAMERA POSITION AND VIEWPOINT
# ============================================================================
# Camera height above the point cloud origin (usually robot base)
# TidyBot2 RealSense camera is mounted at ~0.8m height on the mast
cam_position = 0.0 0.0 0.8

# Camera forward direction for normal estimation
# (not critical for grasp quality, but helps a bit)
forward_direction = 0.0 1.0 0.0

# ============================================================================
# CLASSIFIER SETTINGS
# ============================================================================
# Which GPU device to use (0 = first GPU, -1 = CPU only)
use_gpu = -1

# Number of images to use per grasp candidate
# Higher = more accurate but slower
num_images_per_grasp = 1

# ============================================================================
# GRASP FILTERING AND SELECTION
# ============================================================================
# Probability threshold for classifying grasps as viable
# Lower threshold = more grasps but lower quality
prob_threshold = 0.1

# Keep only the top N grasps by probability score
min_aperture = 0
max_aperture = 0.10

# ============================================================================
# INPUT CLOUD PREPROCESSING
# ============================================================================
# Voxel grid size for downsampling (meter)
# Smaller = more detail but slower processing
# Set to 0 to disable downsampling
voxel_size = 0.005

# Maximum number of points to keep
# Automatically downsamples if exceeded
max_num_samples = 50000
